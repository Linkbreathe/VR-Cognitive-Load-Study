[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-guard"
version = "0.1.0"
description = "Non-causal evidence dependency audit for proposed environment changes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-guard-replay = "evidence_guard.replay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_guard*"]
